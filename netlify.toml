[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Webpack's build cache is never deployed, but it records env values and trips secret scanning.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"
  # NEXT_PUBLIC_* values are shipped to the browser by design.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
