name: Deploy Talevo to Cloudflare

on:
  push:
    branches: [security-hardening]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talevo-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/security-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 5a001ddfb0da267963f6df23e61a3e34
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          cache: npm
      - name: Check deployment configuration
        run: |
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::กรุณาตั้งค่า GitHub Actions secret: $name"
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run lint
      - name: Dependency and security gates
        run: |
          npm audit --audit-level=moderate
          npm run qa:security
          node scripts/qa-security-runtime.cjs
          npm run qa:auth
          npm run qa:persistence
          npm run qa:notifications
      - name: Build without deployment credentials
        run: npm run deploy:vinext -- --build-only --ci
      - name: Check public build for secrets and source maps
        run: node scripts/qa-public-secrets.mjs .cloudflare/output/v1/workers/default/assets
      - name: Deploy using existing Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::กรุณาตั้งค่า GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          npm run deploy:vinext -- --skip-build --ci
